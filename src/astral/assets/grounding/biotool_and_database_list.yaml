# Normalized BioTIER tool/database lookup used by ASTRAL card compilation.
# Selection is simulated conversation context only; no external tool is executed.
schema_id: astral.biotool_database.lookup
schema_version: 1
lookup_id: astral_biotool_and_database
lookup_version: 1
purpose: Controlled BioTIER tool and database menu for deterministic simulated conversation context. This lookup does not grant executable tool access.
provenance:
  source_catalog: biotier_astral_biotool_catalog_provenance_patch
  source_path: BioTIER_+_BioTools/working/remediation/04_biotool_catalog_payload.yaml
  source_sha256: 05d992341a9b9c5ebb93743d234a58b1ee3fc1649b41918cfdeb8e81b00481c9
  research_date: '2026-07-21'
  completeness_scope: Coverage of materially distinct capability categories; not an enumeration of every tool worldwide.
selection:
  strategy: deterministic_uniform
  seed_namespace: biotool_database
  candidate_order: id_ascending
  mode: simulated_conversation_only
  no_selection_when_route_categories_empty: true
