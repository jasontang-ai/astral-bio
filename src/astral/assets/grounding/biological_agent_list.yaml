  - bact.salmonella_typhi
  - bact.salmonella_paratyphi
  - bact.xanthomonas_oryzae
  - fungal.fusarium_langsethiae
  - fungal.fusarium_sporotrichioides
  - toxin.clostridium_perfringens_enterotoxin
  - toxin.modeccin
  - toxin.viscumin
  - toxin.volkensin
  - toxin.ht2_toxin
  - toxin.microcystin
  - toxin.gonyautoxin
  - toxin.nodularin
  - toxin.palytoxin
  - toxin.neosaxitoxin
  curated_retagged:
  - virus.influenza_a_1957_h2n2
  - virus.influenza_a_1968_h3n2
  - fungal.coniothyrium_glycines
  source_registry_ref: ../BioTIER_+_BioTools/restricted_directory_curation/private/ASTRAL_Concerning_Agent_Directory_Sources.md
score_schema:
  reference: ../BioTIER_+_BioTools/restricted_directory_curation/Transmisibility_and_virulence_scoring.md
  basis: Typical profile in the susceptible host population
  transmissibility:
    minimum: 0
    maximum: 4
  virulence:
    minimum: 0
    maximum: 3
defaults:
  status: active
field_semantics:
  broad_eligible: May be selected by a non-menu route when category and tag constraints also match.
  high_risk: SARS-CoV-1 and MERS-CoV (high-fatality coronaviruses), plus mammal-infecting
    pathogens with R0 above ~2.5 in the susceptible host population (e.g. measles, mumps,
    rubella, poliovirus and other enteroviruses, variola major/minor, Bordetella pertussis,
    influenza strains). The BioTIER high_risk_pathogens_v1 fixed menu mirrors this flag
    exactly; keep the two in sync when adding or reclassifying entries.
tag_vocabulary:
- infectious
- mammal-infecting
- human-infecting
- animal-infecting
- plant-infecting
- vector-borne
- toxin
- aav
- lentivirus

- us-select-agent
- uk-schedule-5
- australia-group
agent_categories:
  any_pathogen:
    label: Any pathogen
    agent_classes:
    - viral
    - bacterial
    - fungal
    - parasitic
    - prion
  virus:
    label: Virus
    agent_classes:
    - viral
  virus_or_bacteria:
    label: Virus or bacteria
    agent_classes:
    - viral
    - bacterial
  prion:
    label: Prion
    agent_classes:
    - prion
  toxin:
    label: Toxin or chemical
    agent_classes:
    - toxin or chemical
  parasite:
    label: Parasite
    agent_classes:
    - parasitic
fixed_menus:
  high_risk_pathogens_v1:
    label: BioTIER high-risk pathogens
    # Mirrors the high_risk entry flag (SARS-CoV-1/MERS-CoV plus mammal-infecting
    # agents with R0 > ~2.5). Diverges from the upstream BioTIER policy list, which
    # also names mpox, vaccinia, cowpox, and HPAI H5N1 (all R0 < 2.5 in humans).
    source_ref: ../BioTIER_+_BioTools/[ext] BioTIER-policy.md#pathogen-lists
    agent_ids:
    - virus.sars_cov
    - virus.mers_cov
    - virus.sars_cov_2
    - virus.measles
    - virus.mumps
    - virus.rubella
    - virus.polio
    - virus.ev_a71
    - virus.ev_d68
    - virus.variola
    - virus.variola_minor
    - bact.bordetella_pertussis
    - virus.influenza_a_1918_h1n1
    - virus.influenza_a_h1n1
    - virus.influenza_a_h3n2
    - virus.influenza_b
    - virus.influenza_a_1957_h2n2
    - virus.influenza_a_1968_h3n2
  ca_high_impact_agricultural_v1:
    label: CA high-impact agricultural pathogens
    source_ref: ../BioTIER_+_BioTools/[ext] BioTIER-policy.md#set-ca
    agent_ids:
    - fungal.puccinia_graminis
    - fungal.magnaporthe_oryzae
    - fungal.cochliobolus_heterostrophus
    - fungal.phakopsora_pachyrhizi
  ca_facility_smallpox_and_historical_influenza_v1:
    label: Smallpox and historical influenza strains
    source_ref: ../BioTIER_+_BioTools/[ext] BioTIER-policy.md#set-ca
    agent_ids:
    - virus.variola
    - virus.influenza_a_1918_h1n1
    - virus.influenza_a_1957_h2n2
    - virus.influenza_a_1968_h3n2
  ca_facility_historical_influenza_v1:
    label: Historical influenza strains
    source_ref: ../BioTIER_+_BioTools/[ext] BioTIER-policy.md#set-ca
    agent_ids:
    - virus.influenza_a_1918_h1n1
    - virus.influenza_a_1957_h2n2
    - virus.influenza_a_1968_h3n2
  ca_facility_smallpox_v1:
    label: Smallpox
    source_ref: ../BioTIER_+_BioTools/[ext] BioTIER-policy.md#set-ca
    agent_ids:
    - virus.variola
  bd_historical_important_pandemic_pathogens_v1:
    label: Historically important pandemic pathogens
    source_ref: ../BioTIER_+_BioTools/[ext] BioTIER-policy.md#set-bd
    agent_ids:
    - virus.variola
    - virus.influenza_a_1918_h1n1
    - virus.influenza_a_1957_h2n2
    - virus.influenza_a_1968_h3n2
    - virus.sars_cov
  bd_medium_impact_agricultural_v1:
    label: BD medium-impact agricultural pathogens
    source_ref: ../BioTIER_+_BioTools/[ext] BioTIER-policy.md#set-bd
    agent_ids:
