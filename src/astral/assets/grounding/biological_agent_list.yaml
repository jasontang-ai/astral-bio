# Normalized ASTRAL biological-agent lookup used by BioTIER route selection.
# Routes select by category, tags, or fixed menu; entry.agent_class remains
# authoritative here and is not duplicated in BioTIER_ASTRAL_routes.yaml.
# Metadata only: no procedures, sequences, handling, acquisition, dose, delivery,
# or deployment information.
schema_version: 1
directory_version: 3
directory_id: biological_agent_list
access_control:
  restricted: true
  public_distribution: prohibited
  public_repository_commit: prohibited
  authorized_access_required: true
provenance:
  merged_from:
  - ASTRAL_concerning_agent_directory_high-risk-pathogens_(with_T&V).yaml
  - ASTRAL_concerning_agent_directory_non-high-risk-pathogens(with_T&V).yaml
  curated_additions:
  - virus.lujo
  - virus.variola_minor
  - virus.mucambo
